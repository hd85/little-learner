<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Little Learner" />
    <meta name="theme-color" content="#FFF8F0" />
    <meta name="description" content="Fun learning activities for little ones" />
    <title>Little Learner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <link rel="manifest" href="/little-learner/manifest.json" />
    <link rel="apple-touch-icon" href="/little-learner/icon-192.png" />
    <style>
      /* Kill Safari bounce/rubber-banding in standalone mode */
      html, body {
        overscroll-behavior: none;
        overflow: hidden;
        height: 100%;
        position: fixed;
        width: 100%;
      }
      #root {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/little-learner/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
